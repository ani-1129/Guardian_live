services:
  # 1. FastAPI Web Service (Backend)
  - type: web
    name: guardian-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: guardian-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: guardian-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 8000

  # 2. Celery Asynchronous Worker
  - type: worker
    name: guardian-celery-worker
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    dockerCommand: celery -A backend.workers.tasks.celery_app worker --loglevel=info
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: guardian-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: guardian-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false

  # 3. Redis Instance (for WebSocket signaling & Celery broker)
  - type: redis
    name: guardian-redis
    plan: free
    ipAllowList: [] # RESTRICTED: only accessible internally within the Render network

databases:
  # 4. PostgreSQL Database
  - name: guardian-db
    databaseName: guardian_db
    user: guardian_user
    plan: free
